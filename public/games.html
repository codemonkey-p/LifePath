<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifePath</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
</head>
<body class="game-page">
<div class="screen">
  <div class="app-header">
    <div class="logo">Games</div>
    <div class="tagline">Pick a game to play</div>
  </div>

  <div class="game-list">
    <button class="game-choice" onclick="window.location.href='/matchGame.html'">
      <span class="game-choice-icon">🃏</span>
      <span class="game-choice-text"><strong>Matching Cards</strong><small>Turn over cards and find the pairs</small></span>
    </button>
    <button class="game-choice" onclick="window.location.href='/missingGame.html'">
      <span class="game-choice-icon">🔍</span>
      <span class="game-choice-text"><strong>What's Missing?</strong><small>Look at some pictures, then spot which one went away</small></span>
    </button>
    <button class="game-choice" onclick="window.location.href='/seenGame.html'">
      <span class="game-choice-icon">👀</span>
      <span class="game-choice-text"><strong>Did You See It?</strong><small>Remember the pictures, then say yes or no</small></span>
    </button>
    <button class="game-choice" onclick="window.location.href='/whereGame.html'">
      <span class="game-choice-icon">📍</span>
      <span class="game-choice-text"><strong>Where Was It?</strong><small>Remember where a picture appeared</small></span>
    </button>
    <button class="game-choice" onclick="window.location.href='/colorGame.html'">
      <span class="game-choice-icon">🎨</span>
      <span class="game-choice-text"><strong>Follow the Colours</strong><small>Watch the colours light up, then tap them in order</small></span>
    </button>
  </div>

  <button class="btn outline" onclick="window.location.href='/brainExercises.html'">Back to Brain Exercises</button>
</div>
<script src="/js/realtime-voice-client.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
